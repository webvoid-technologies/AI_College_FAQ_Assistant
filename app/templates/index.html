<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MJRCET AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef4ff', 100: '#dbe6fe', 500: '#3b6ef6',
                            600: '#2b5ce6', 700: '#2349c4'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
                'Roboto', sans-serif;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg { animation: msg-in 0.25s ease-out; }

        @keyframes dot-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-5px); opacity: 1; }
        }
        .typing-dot {
            width: 7px; height: 7px; border-radius: 9999px;
            background: #9ca3af; display: inline-block;
            animation: dot-bounce 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        #messages::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .markdown-content h1 { font-size: 1.4rem; font-weight: 700; margin: 0.9rem 0 0.6rem; }
        .markdown-content h2 { font-size: 1.2rem; font-weight: 700; margin: 0.8rem 0 0.5rem; }
        .markdown-content h3 { font-size: 1.05rem; font-weight: 600; margin: 0.6rem 0 0.4rem; }
        .markdown-content p { margin-bottom: 0.55rem; line-height: 1.6; }
        .markdown-content p:last-child { margin-bottom: 0; }
        .markdown-content ul { list-style: disc; padding-left: 1.4rem; margin-bottom: 0.55rem; }
        .markdown-content ol { list-style: decimal; padding-left: 1.4rem; margin-bottom: 0.55rem; }
        .markdown-content li { margin-bottom: 0.3rem; line-height: 1.55; }
        .markdown-content strong { font-weight: 600; color: #111827; }
        .markdown-content a { color: #2b5ce6; }
        .markdown-content a:hover { text-decoration: underline; }
        .markdown-content code {
            background: #eef2f7; padding: 0.1rem 0.35rem; border-radius: 0.3rem;
            font-size: 0.85em; font-family: Menlo, Monaco, Consolas, monospace;
        }
        .markdown-content table {
            border-collapse: collapse; margin: 0.6rem 0; width: 100%;
            font-size: 0.875rem; border-radius: 0.5rem; overflow: hidden;
        }
        .markdown-content th, .markdown-content td {
            border: 1px solid #e2e8f0; padding: 0.45rem 0.8rem; text-align: left;
        }
        .markdown-content th { background: #f1f5f9; font-weight: 600; }
        .markdown-content tr:nth-child(even) td { background: #fafbfc; }
    </style>
</head>
<body class="h-screen flex flex-col bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 overflow-hidden">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur border-b border-slate-200/70 shadow-sm z-10">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center space-x-3">
            <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-500/20">
                <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900 leading-tight">MJRCET AI Assistant</h1>
                <p class="text-xs text-gray-500">Your campus FAQ assistant</p>
            </div>
            <div class="ml-auto flex items-center space-x-1.5 text-xs text-emerald-600 font-medium">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="hidden sm:inline">Online</span>
            </div>
        </div>
    </header>

    <!-- Chat area -->
    <main class="flex-1 min-h-0 max-w-4xl w-full mx-auto px-4 py-4 flex flex-col">
        <div id="messages" class="flex-1 min-h-0 overflow-y-auto rounded-2xl bg-white/70 backdrop-blur border border-slate-200/60 shadow-xl shadow-slate-900/5 p-5 space-y-5"></div>

        <!-- Suggested questions -->
        <div id="suggestions" class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2">
            <button onclick="suggest(this)" class="sug text-left text-sm bg-white/80 hover:bg-brand-50 hover:border-brand-500 text-gray-700 hover:text-brand-700 px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm transition-all duration-150 hover:shadow-md hover:-translate-y-px">What courses are offered in CSE department?</button>
            <button onclick="suggest(this)" class="sug text-left text-sm bg-white/80 hover:bg-brand-50 hover:border-brand-500 text-gray-700 hover:text-brand-700 px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm transition-all duration-150 hover:shadow-md hover:-translate-y-px">Tell me about admission requirements</button>
            <button onclick="suggest(this)" class="sug text-left text-sm bg-white/80 hover:bg-brand-50 hover:border-brand-500 text-gray-700 hover:text-brand-700 px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm transition-all duration-150 hover:shadow-md hover:-translate-y-px">What are the fee structures?</button>
            <button onclick="suggest(this)" class="sug text-left text-sm bg-white/80 hover:bg-brand-50 hover:border-brand-500 text-gray-700 hover:text-brand-700 px-4 py-2.5 rounded-xl border border-slate-200 shadow-sm transition-all duration-150 hover:shadow-md hover:-translate-y-px">Tell me about placements</button>
        </div>

        <!-- Input -->
        <form id="chat-form" class="mt-4">
            <div class="flex items-end space-x-2 bg-white rounded-2xl shadow-lg shadow-slate-900/5 border border-slate-200 p-2">
                <textarea id="input" rows="1" placeholder="Ask me anything about MJRCET..."
                    class="flex-1 px-3 py-2.5 bg-transparent resize-none focus:outline-none text-[15px] text-gray-800 placeholder-gray-400 max-h-32"
                    autocomplete="off"></textarea>
                <button id="send-btn" type="submit" title="Send"
                    class="h-10 w-10 shrink-0 rounded-xl bg-gradient-to-br from-brand-500 to-indigo-600 text-white flex items-center justify-center hover:from-brand-600 hover:to-indigo-700 disabled:from-gray-300 disabled:to-gray-400 disabled:cursor-not-allowed transition-all shadow-md shadow-blue-500/20 disabled:shadow-none">
                    <svg class="h-5 w-5 -ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </div>
            <p class="text-center text-[11px] text-gray-400 mt-2">Answers are generated from the MJRCET website — verify important details with the college office.</p>
        </form>
    </main>

    <script>
        const messagesEl = document.getElementById('messages');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const suggestions = document.getElementById('suggestions');

        const history = [];
        let isLoading = false;

        const BOT_ICON = '<svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>';
        const USER_ICON = '<svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>';

        function scrollToBottom() {
            messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addMessage(role, content, sources = []) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `msg flex ${isUser ? 'justify-end' : 'justify-start'}`;

            const body = isUser
                ? `<p class="whitespace-pre-wrap leading-relaxed">${escapeHtml(content)}</p>`
                : `<div class="markdown-content text-gray-800">${marked.parse(content)}</div>`;

            let sourcesHtml = '';
            if (!isUser && sources.length) {
                sourcesHtml = '<div class="mt-2.5 pt-2 border-t border-slate-200/80 space-y-1">' +
                    sources.map(s => `
                        <a href="${s.url}" target="_blank" rel="noopener noreferrer"
                           class="flex items-center space-x-1.5 text-xs text-brand-600 hover:text-brand-700 hover:underline">
                            <svg class="h-3 w-3 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                            </svg>
                            <span class="truncate">${escapeHtml(s.title)}</span>
                        </a>`).join('') + '</div>';
            }

            wrapper.innerHTML = `
                <div class="flex space-x-2.5 max-w-[85%] sm:max-w-[75%] ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="flex-shrink-0 h-8 w-8 rounded-full flex items-center justify-center shadow-sm ${isUser ? 'bg-gradient-to-br from-brand-500 to-indigo-600' : 'bg-gradient-to-br from-emerald-500 to-teal-600'}">
                        ${isUser ? USER_ICON : BOT_ICON}
                    </div>
                    <div class="min-w-0">
                        <div class="px-4 py-2.5 rounded-2xl shadow-sm ${
                            isUser
                                ? 'bg-gradient-to-br from-brand-500 to-indigo-600 text-white rounded-tr-md'
                                : 'bg-white border border-slate-200/70 rounded-tl-md'
                        }">
                            ${body}
                        </div>
                        ${sourcesHtml}
                    </div>
                </div>`;

            messagesEl.appendChild(wrapper);
            scrollToBottom();
        }

        function showLoading() {
            const wrapper = document.createElement('div');
            wrapper.id = 'loading-msg';
            wrapper.className = 'msg flex justify-start';
            wrapper.innerHTML = `
                <div class="flex space-x-2.5">
                    <div class="flex-shrink-0 h-8 w-8 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-sm">${BOT_ICON}</div>
                    <div class="bg-white border border-slate-200/70 px-4 py-3 rounded-2xl rounded-tl-md shadow-sm">
                        <div class="flex space-x-1.5">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>`;
            messagesEl.appendChild(wrapper);
            scrollToBottom();
        }

        function hideLoading() {
            document.getElementById('loading-msg')?.remove();
        }

        function suggest(btn) {
            input.value = btn.textContent.trim();
            autoGrow();
            input.focus();
            form.requestSubmit();
        }

        function autoGrow() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 128) + 'px';
        }
        input.addEventListener('input', autoGrow);

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text || isLoading) return;

            suggestions.style.display = 'none';
            input.value = '';
            autoGrow();
            isLoading = true;
            sendBtn.disabled = true;

            addMessage('user', text);
            history.push({ role: 'user', content: text });
            showLoading();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history.slice(-6) })
                });
                const data = await res.json();
                hideLoading();

                const reply = data.response || data.error || 'Something went wrong.';
                addMessage('assistant', reply, data.sources || []);
                history.push({ role: 'assistant', content: reply });
            } catch (err) {
                hideLoading();
                addMessage('assistant', 'Sorry, I encountered an error processing your request. Please try again.');
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                input.focus();
            }
        });

        addMessage('assistant', "Hello! I'm the **MJRCET AI Assistant**. I can help you with courses, admissions, fees, facilities, examinations, placements and more. How can I assist you today?");
        input.focus();
    </script>
</body>
</html>
